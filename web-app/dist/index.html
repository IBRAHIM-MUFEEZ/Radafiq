<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A6FD4" />
    <meta name="description" content="Radafiq - Customer Ledger & Finance Manager" />
    <title>Radafiq</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preload" as="image" href="/logo-Photoroom.png" />
    <style>
      /* Instant CSS splash — shown before JS loads */
      .splash-init {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #07070D;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      .splash-init.splash-hidden { opacity: 0; }
      .splash-init img { width: 64px; height: 64px; animation: splash-breathe 1.5s ease-in-out infinite; }
      @keyframes splash-breathe { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    </style>
    <script type="module" crossorigin src="/assets/index-D23stG9r.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-PrWWzDFI.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="splash-init" id="splash-init">
        <img src="/logo-Photoroom.png" alt="Loading" />
      </div>
    </div>
    <script>
      // Hide the CSS splash once JS loads — framer-motion/React takes over
      document.addEventListener('DOMContentLoaded', function() {
        var el = document.getElementById('splash-init');
        if (el) { el.classList.add('splash-hidden'); setTimeout(function() { el.remove(); }, 500); }
      });
    </script>
  </body>
</html>
